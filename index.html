
<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Minta Maaf ke Febyy🥺💖</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<!-- Step 1: Input name -->
	<div class="card" id="nameCard">
		<h1>Hai Febyyy💕</h1>
		<p>Boleka aku tauu, km lebi suka dipanggil apaaaa? 🥰</p>
		<input type="text" id="nickname" placeholder="contoh: ayangg, ndukk, cemplukk, apa yg laen..." />
		<button id="submitName">Lanjut 💌</button>
	</div>

	<!-- Step 2: Minta maaf -->
	<div class="card" id="apologyCard" style="display: none;">
		<h1>Aku minta maaf yaaa🥺💖</h1>
		<p id="apologyText">Aku tau aku salaa, tp aku gak bermaksud bikin kamu kesel sampe marah ginii.</p>
		<div class="btn-group">
			<button id="yesBtn">Maafin 💖</button>
			<button id="noBtn">Enggak 😠</button>
		</div>
	</div>

	<!-- signature placed under the card(s) -->
	<div class="footer">
		Made by
		<a href= target="_blank" rel="noopener">
			Pacarmu Danaaa
		</a>
		💖
	</div>

	<!-- Popup -->
	<div class="popup" id="popup">
		<div class="popup-content">
			<h2 id="popupTitle"></h2>
			<p id="popupMsg"></p>
			<div class="hearts" id="hearts"></div>
		</div>
	</div>

	<script src="script.js"></script>
</body>
</html>
